<?xml version="1.0"?>


<!-- See https://font.subf.dev/en/playground/ for configuration -->
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Set stylistic font features for Maple Mono</description>
  <match target="font">
    <test name="family" compare="contains" ignore-blanks="true">
      <string>Maple Mono</string>
    </test>
    <edit name="fontfeatures" mode="append">
      <string>calt on</string>
      <string>cv01 on</string>
      <string>cv02 on</string>
      <string>cv31 on</string>
      <string>ss03 on</string>
      <string>ss07 on</string>
      <string>ss08 on</string>
      <string>ss05 on</string>
    </edit>
  </match>
</fontconfig>
