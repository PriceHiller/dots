<?xml version="1.0"?>

<!-- See https://github.com/tonsky/FiraCode/wiki/How-to-enable-stylistic-sets for a listing of features -->

<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <description>Set stylistic font features for Fira Code</description>
  <match target="font">
    <test name="family" compare="contains" ignore-blanks="true">
      <string>Fira</string>
    </test>
    <edit name="fontfeatures" mode="append">
      <string>cv02 on</string>
      <string>cv30 on</string>
      <string>ss05 on</string>
      <string>ss03 on</string>
      <string>ss04 on</string>
      <string>cv26 on</string>
      <string>ss10 on</string>
    </edit>
  </match>
</fontconfig>
