name: Check Flake
enable-email-notifications: true
on:
  - push
  - workflow_dispatch
env:
  NIX_CONFIG: |
    experimental-features = flakes nix-command
    accept-flake-config = true
jobs:
  Check-Formatting:
    runs-on: default
    steps:
      - name: Rewrite SSH Git Refs to HTTPS
        run: |
          git config --global url.'https://forgejo:${{ secrets.REPOS_READ_TOKEN }}@git.pricehiller.com'.insteadOf 'ssh://forgejo@git.pricehiller.com:10322'
      - name: Check out code
        uses: https://git.pricehiller.com/actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          token: "${{ secrets.REPOS_READ_TOKEN }}"
          submodules: true
      - name: Nix Version
        run: nix --version
      - name: Check Formatting
        run: nix build ".#checks.$(nix eval --impure --raw --expr 'builtins.currentSystem').formatting"
      - name: Nix Flake Check
        run: |
          nix flake check
